<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Capstone Project Resources</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background: #f5f7fb; color: #111827;
  }
  .card {
    width: min(92vw, 520px); padding: 42px 30px; text-align: center;
    background: white; border: 1px solid #e5e7eb; border-radius: 22px;
    box-shadow: 0 18px 50px rgba(17,24,39,.10);
  }
  .mark {
    width: 54px; height: 54px; margin: 0 auto 20px; border-radius: 14px;
    display: grid; place-items: center; background: #111827; color: white;
    font-weight: 800; font-size: 22px;
  }
  h1 { margin: 0 0 10px; font-size: 28px; letter-spacing: -.5px; }
  p { margin: 0 0 28px; color: #6b7280; line-height: 1.55; }
  .btn {
    display: block; width: 100%; padding: 15px 18px; margin-top: 12px;
    border-radius: 12px; text-decoration: none; font-weight: 700;
    transition: transform .15s ease, opacity .15s ease;
  }
  .btn:hover { transform: translateY(-1px); opacity: .92; }
  .primary { background: #111827; color: white; }
  .secondary { background: #eef2f7; color: #111827; }
  .footer { margin-top: 24px; font-size: 12px; color: #9ca3af; }
</style>
</head>
<body>
  <main class="card">
    <div class="mark">C</div>
    <h1>Capstone Project Resources</h1>
    <p>Access the project documentation or explore the source code.</p>
    <a class="btn primary" href="https://ucd-my.sharepoint.com/:w:/g/personal/ananya_sharma_ucdconnect_ie/IQAMJta0-fDYQJagFyYaNjloAQwfeMBg0weqYr5-7smJoMY?e=tNAa3X" target="_blank" rel="noopener">📄 View Word Document</a>
    <a class="btn secondary" href="https://github.com/advait27/Capstone" target="_blank" rel="noopener">💻 GitHub Repository</a>
    <div class="footer">Capstone Project</div>
  </main>
</body>
</html>
